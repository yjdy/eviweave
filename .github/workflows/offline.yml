name: Offline regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      TMPDIR: ${{ github.workspace }}/.audit/ci/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/.audit/ci/cache/pip
      UV_CACHE_DIR: ${{ github.workspace }}/.audit/ci/cache/uv
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare project-local paths
        run: mkdir -p .audit/ci/tmp .audit/ci/python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        env:
          RUNNER_TEMP: ${{ github.workspace }}/.audit/ci/tmp
          AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/.audit/ci/python
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare build environment
        run: |
          python -m venv .audit/ci/build-env
          .audit/ci/build-env/bin/python -m pip install 'build>=1,<2'
      - name: Build, install and run offline unit tests
        run: .audit/ci/build-env/bin/python -B tools/ci_check.py --output-root .audit/ci/result
