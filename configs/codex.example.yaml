# All host paths resolve relative to this configuration file.
experiment:
  model:
    key: qwen3.8-flash
    model: qwen3.8-flash
    api_key_env: EVIWEAVE_API_KEY
    openai_base_url: https://example.invalid/v1
    max_output_tokens: 32768
    context_window: 983616
  wall_time_seconds: 1800
  concurrency: 1
  workbench:
    image: dataspace-workbench:1.0
    rootfs_path: ../.runtimes/data-workbench-1.0/rootfs
harnesses:
  codex:
    enabled: true
    executable: /mnt/runtime/codex/bin/codex
    version: 0.145.0
    runtime_path: ../.runtimes/codex-{version}/platform-package/vendor/x86_64-unknown-linux-musl
    runtime_mount: /mnt/runtime/codex
    wire_api: responses
    simple_fixes: true
