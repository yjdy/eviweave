[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eviweave"
version = "0.1.0"
description = "EviWeave — Evidence-Guided Data Agents, historical relation-v6 baseline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "袁珺 / Jun Yuan"}]
dependencies = ["PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/yjdy"

[project.scripts]
eviweave = "dataspace_baselines.cli:main"
dataspace-baselines = "dataspace_baselines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dataspace_baselines*"]

[tool.setuptools]
include-package-data = false
